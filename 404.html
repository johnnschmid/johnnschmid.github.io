<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Этот скрипт ловит любой запрос несуществующей страницы на GitHub Pages,
        // сохраняет путь и мгновенно перенаправляет на главный index.html с параметром.
        const pathSegmentsToKeep = 0; // 0 для домена первого уровня (johnnschmid.github.io)
        const l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            l.search + l.hash
        );
    </script>
</head>
<body>
</body>
</html>
